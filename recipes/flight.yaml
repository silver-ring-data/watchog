# 항공권 — 특정 구간 가격 추적이 아니라 핫딜이 뜨면 알린다 (2026-09-11 결정).
# Google Flights 특가는 브라우저 렌더링이 필요해 runner: local 만 가능하다.
# 커뮤니티 피드는 제목 전체를 보되 바뀐 줄에 "항공" 이 있을 때만 알린다(trigger).
# select 로 "항공" 만 뽑으면 해당 글이 없는 시점에 필터 실패 오류가 나므로 쓰지 않는다.
name: flight
topic: flight
kind: item
mode: instant
runner: local
sources:
  - type: web
    title: Google Flights · 서울발 특가
    url: https://www.google.com/travel/flights/deals?hl=ko
    fetch: browser
    every: 12h
  - type: feed
    title: 뽐뿌게시판 RSS · 항공
    url: https://www.ppomppu.co.kr/rss.php?id=ppomppu
    select: xpath://item/title
    trigger: [항공]
    every: 1h
  - type: feed
    title: 루리웹 핫딜 RSS · 항공
    url: https://bbs.ruliweb.com/market/board/1020/rss
    select: xpath://item/title
    trigger: [항공]
    every: 1h
  - type: web
    title: 클리앙 알뜰구매 · 항공
    url: https://www.clien.net/service/board/jirum
    select: span.list_subject
    trigger: [항공]
    every: 1h
verified: 2026-09-11
